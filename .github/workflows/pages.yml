name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exams twin
        run: |
          node scripts/render-exams.mjs
          git diff --exit-code -- exams.html data/certs.xml
      - name: Stage public files
        run: |
          mkdir -p _site/css _site/img
          cp index.html method.html writing.html exams.html links.html contact.html _site/
          cp VERSION _site/
          cp .nojekyll _site/
          cp -a css/. _site/css/
          cp -a img/. _site/img/
      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -a _site/. "$work/"
          cd "$work"
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish static spine"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
      - name: Enable Pages from gh-pages if the token allows it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api repos/${GITHUB_REPOSITORY}/pages >/dev/null 2>&1; then
            echo "$payload" | gh api --method PUT repos/${GITHUB_REPOSITORY}/pages --input -
          else
            echo "$payload" | gh api --method POST repos/${GITHUB_REPOSITORY}/pages --input - || true
          fi
