name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exams twin
        run: |
          node scripts/render-exams.mjs
          git diff --exit-code -- exams.html data/certs.xml
      - name: Stage public files
        run: |
          mkdir -p _site/css _site/img
          cp index.html method.html writing.html exams.html links.html contact.html _site/
          cp VERSION _site/
          cp .nojekyll _site/
          cp -a css/. _site/css/
          cp -a img/. _site/img/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
