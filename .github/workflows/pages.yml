name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Stage public files
        run: |
          mkdir -p _site/css _site/img _site/js
          # Root files
          cp index.html robots.txt sitemap.xml VERSION .nojekyll _site/
          # Assets
          cp -a css/. _site/css/
          cp -a img/. _site/img/
          cp -a js/. _site/js/
          # All 50 locale directories
          for locale in en sr fr de hi vi pt-BR es ja ko zh-CN ru pl it nl tr hr uk cs sk ro hu sv fi da id th ar zh-TW el bn pt nb he bg sl lt lv et ca ms fil fa ur sw ta af sq mk ka; do
            if [ -d "$locale" ]; then
              cp -a "$locale" _site/
            fi
          done
      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -a _site/. "$work/"
          cd "$work"
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish static spine"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
      - name: Enable Pages from gh-pages if the token allows it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          if gh api repos/${GITHUB_REPOSITORY}/pages >/dev/null 2>&1; then
            echo "$payload" | gh api --method PUT repos/${GITHUB_REPOSITORY}/pages --input -
          else
            echo "$payload" | gh api --method POST repos/${GITHUB_REPOSITORY}/pages --input - || true
          fi
