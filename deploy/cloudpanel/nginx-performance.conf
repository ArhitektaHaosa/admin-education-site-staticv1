# Cloud Panel nginx performance directives for admin.education static site
# Add this to: Sites → [your domain] → Vhost → Custom Nginx Directives

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";

# Gzip static (pre-compressed .gz files)
# Enable if you pre-compress files: gzip -k css/site.css → site.css.gz
gzip_static on;

# Brotli (only if ngx_brotli module is installed)
# Check: nginx -V 2>&1 | grep brotli
# Uncomment if available:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
# brotli_static on;

# Open file cache
open_file_cache max=1000 inactive=20s;
open_file_cache_valid 30s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Security headers (safe for static HTML + CSS + SVG only)
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Content Security Policy (strict: self only, no inline scripts)
# Adjust if you add inline JS or external resources
add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Static asset caching (CSS, images)
location ~* \.(css|svg|jpg|jpeg|png|gif|ico|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# HTML caching (short, must revalidate after deploys)
location ~* \.(html)$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
}

# Root location
location / {
    try_files $uri $uri/ =404;
}

# Disable access logs for common noise (optional)
location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }
